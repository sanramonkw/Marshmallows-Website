# marshmallows.co — host-level redirect config
#
# ###########################################################################
# ⚠ READ THIS FIRST — THIS SITE IS DIFFERENT FROM THE OTHER THREE
#
# 1. DO NOT add a general trailing-slash redirect here.
#    The booking flow submits by POST. CLAUDE.md/DEPLOYMENT.md are explicit:
#    the booking routes must always be called WITH the trailing slash, and an
#    inserted 301 will break the POST (a 301 on a POST is re-issued as GET by
#    most clients, silently losing the form body — a booking that appears to
#    submit and then vanishes). Specifically: do NOT set the usual
#    `absolute_redirect`/trailing-slash normalisation on /booking/, /booking-ar/
#    or any route the booking form posts to.
#
# 2. The custom 404 page ALREADY WORKS on this site (verified 2026-08-07: a
#    bogus path returned a 32 KB rendered page, not nginx's 153-byte default).
#    This site runs the Node adapter (SSR) behind a proxy, so the application
#    handles its own 404s. Do NOT add `error_page 404` here — it would
#    override a working page.
#
# So unlike the other three sites, this file covers ONLY host canonicalisation
# and the legacy service-CPT redirects. Nothing else needs changing.
# ###########################################################################

# ---------------------------------------------------------------------------
# PART A — host canonicalisation
# ---------------------------------------------------------------------------
# Cloudflare sits in front of this site (Server: cloudflare, verified
# 2026-08-07). Do the canonicalisation at Cloudflare, not the origin:
#   - SSL/TLS → Edge Certificates → "Always Use HTTPS" = ON
#   - Rules → Redirect Rules: www.marshmallows.co → marshmallows.co
# Then confirm all of http://marshmallows.co/ , http://www.marshmallows.co/ ,
# https://www.marshmallows.co/ end at https://marshmallows.co/ .
#
# Cloudflare redirect rules preserve the method for POST, but scope the rule
# to the hostname only — do not add any path-rewriting to it (see warning 1).

# ---------------------------------------------------------------------------
# PART B — legacy WordPress service-CPT redirects
# ---------------------------------------------------------------------------
# CLAUDE.md records ~66 legacy per-service CPT detail URLs (roughly 33 per
# locale, e.g. /service-salon/nails/) which no longer exist as pages: their
# content now lives inside the three price-list pages. DEPLOYMENT.md lists
# these 301s as an open pre-launch item.
#
# The current AR ↔ EN price-list pages these should point at:
#   Salon Service  →  AR /services-ar/salon-service-ar/
#                     EN /en/services/salon-service/
#   Home Service   →  AR /services-ar/home-service-ar/
#                     EN /en/services/home-service/
#
# I have NOT written the rules, because the 33 old slugs per locale are not
# enumerated anywhere in this repo and guessing them would produce redirects
# that silently point at the wrong price list. To complete this:
#
#   1. Export the indexed URL list from Google Search Console → Pages
#      (or the old WordPress sitemap) and filter for the service CPT paths.
#   2. Group each old URL by which price list its content moved into, and by
#      locale.
#   3. Add one rule per URL, each pointing at its FINAL target in one hop:
#
#        location = /service-salon/<old-slug>/ {
#            return 301 /en/services/salon-service/;
#        }
#        location = /services-ar/<old-slug-ar>/ {
#            return 301 /services-ar/salon-service-ar/;
#        }
#
#      Keep AR → AR and EN → EN. Sending an Arabic visitor to an English
#      price list is worse for them than the 404 they get today.
#
# A whole-prefix catch-all (e.g. `location ^~ /service-salon/`) is tempting
# but would send every old service URL to a single price list regardless of
# which one actually contains it. Acceptable only as a last resort if the slug
# list cannot be recovered — and note it in DEPLOYMENT.md if you do that.
